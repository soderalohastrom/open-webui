version: '3.8'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - open-webui:/app/backend/data
      - /Volumes/Paumalu/ollama/models:/root/.ollama/models
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_API_BASE_URL=http://host.docker.internal:11434/api
      - OLLAMA_API_TIMEOUT=120
      - OLLAMA_SYNC_MODELS=true
      - ENABLE_WEBSOCKET_SUPPORT=true
      - WEBSOCKET_MANAGER=memory
      - CORS_ALLOW_ORIGIN=http://localhost:8080
      - SOCKETIO_MESSAGE_QUEUE_MAXLEN=1000
      - SOCKETIO_ASYNC_MODE=asgi
      - SOCKETIO_PING_TIMEOUT=60
      - SOCKETIO_PING_INTERVAL=25
      - SOCKETIO_MAX_HTTP_BUFFER_SIZE=1000000
      - SOCKETIO_CORS_ALLOWED_ORIGINS=["http://localhost:8080"]
      - OPENAI_API_KEY=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
      - OPENAI_API_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_API_TIMEOUT=120
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - open-webui-net

networks:
  open-webui-net:
    name: open-webui-net

volumes:
  open-webui:
    name: open-webui
